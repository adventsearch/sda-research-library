<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SDA Research Library Assistant</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background-color: #1a1a2e;
      font-family: 'Georgia', serif;
    }



    .chat-container {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      width: 100%;
    }

    .iframe-wrapper {
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    footer {
      background-color: #1a1a2e;
      color: #6b6b8a;
      font-size: 0.6rem;
      text-align: center;
      padding: 4px 12px;
      border-top: 1px solid #2e2e4a;
      letter-spacing: 0.03em;
      flex-shrink: 0;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="iframe-wrapper">
      <iframe
        src="https://apps.abacus.ai/chatllm/?appId=d5d0a0aae&hideTopBar=2"
        title="SDA Research Library Assistant"
        allow="clipboard-write"
        loading="lazy"
      ></iframe>
    </div>

    <footer>
      Responses are drawn from indexed SDA research volumes. Always verify quotes against primary sources.
    </footer>
  </div>
</body>
</html>
